name: "PR checks"

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  go:
    name: "Lint, build and test"
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Setup Go"
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod

      - name: "Check formatting"
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: "Vet"
        run: go vet ./...

      - name: "Build"
        run: go build -o run-app .

      - name: "Test"
        run: go test ./...

      - name: "Smoke test"
        run: |
          PORT=8080 ./run-app &
          sleep 2
          for path in /health /links /robots.txt /sitemap.xml /.well-known/security.txt; do
            curl --fail --silent --show-error --output /dev/null "http://localhost:8080$path"
          done

  docker:
    name: "Docker build"
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Build image"
        run: docker build .
